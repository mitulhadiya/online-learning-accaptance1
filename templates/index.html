<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dropout Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:550px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:6px;
        }

        input,
        select{
            width:100%;
            padding:10px;
            margin-bottom:18px;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:15px;
        }

        input[type="submit"]{
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
            font-size:17px;
        }

        input[type="submit"]:hover{
            background:#0b5ed7;
        }

        .result{
            margin-top:20px;
            padding:15px;
            border-radius:8px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Student Dropout Prediction</h1>

<form action="/predict" method="POST">

<label>Age</label>

<input
type="number"
name="age"
required>

<label>Gender</label>

<select name="gender" required>

<option value="" disabled selected>
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

<label>Device Type</label>

<select name="device_type" required>

<option value="" disabled selected>
Select Device Type
</option>

<option value="Laptop">
Laptop
</option>

<option value="Desktop">
Desktop
</option>

<option value="Tablet">
Tablet
</option>

<option value="Mobile">
Mobile
</option>

</select>

<label>Login Frequency Weekly</label>

<input
type="number"
name="login_frequency_weekly"
required>

<label>Average Session Duration (Minutes)</label>

<input
type="number"
step="0.01"
name="avg_session_duration_min"
required>

<label>Video Watch Time (Minutes)</label>

<input
type="number"
step="0.01"
name="video_watch_time_min"
required>

<label>Average Quiz Score</label>

<input
type="number"
step="0.01"
name="avg_quiz_score"
required>

<label>Attendance Rate</label>

<input
type="number"
step="0.01"
name="attendance_rate"
required>

<label>Final Grade</label>

<input
type="number"
step="0.01"
name="final_grade"
required>

<input
type="submit"
value="Predict">

</form>

{% if prediction_text %}

<div class="result">

{{ prediction_text }}

</div>

{% endif %}

</div>

</body>
</html>
